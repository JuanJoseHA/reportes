server.port=8086
spring.application.name=reportes

# Nos conectamos a la BD de incidencias
spring.datasource.url=jdbc:mysql://192.168.212.117:3306/db_incidencias?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MUY IMPORTANTE: Evita que Hibernate modifique las tablas de esta base de datos
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Desactivar Eureka temporalmente
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false